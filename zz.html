<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARENA — Circle Survival</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Share+Tech+Mono&display=swap');
*{margin:0;padding:0;box-sizing:border-box;}
body{
  background:#07070f;
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  font-family:'Share Tech Mono',monospace;
  overflow:hidden;
  color:#fff;
}

/* ── BETTING SCREEN ── */
#bet-screen{
  display:flex;
  flex-direction:column;
  align-items:center;
  animation:fadeIn .5s ease;
}
@keyframes fadeIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
.bet-title{
  font-family:'Bebas Neue',cursive;
  font-size:4rem;
  letter-spacing:.4em;
  color:#ff3333;
  text-shadow:0 0 30px #ff333355,0 0 60px #ff222222;
  line-height:1;
}
.bet-sub{color:#444;font-size:.7rem;letter-spacing:.3em;margin-bottom:30px;margin-top:4px;}
.bet-prompt{color:#777;font-size:.72rem;letter-spacing:.2em;margin-bottom:18px;text-transform:uppercase;}
.bet-grid{display:flex;gap:14px;margin-bottom:24px;}
.bet-card{
  display:flex;flex-direction:column;align-items:center;gap:9px;
  background:#0d0d1a;border:2px solid #1a1a2e;border-radius:14px;
  padding:18px 14px;cursor:pointer;
  transition:transform .18s,border-color .18s,box-shadow .18s;
  width:104px;position:relative;
}
.bet-card:hover{transform:translateY(-4px) scale(1.04);}
.bet-card.selected{transform:translateY(-7px) scale(1.07);}
.bet-check{
  position:absolute;top:7px;right:7px;
  width:17px;height:17px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:9px;font-weight:bold;
  opacity:0;transition:opacity .18s;
}
.bet-card.selected .bet-check{opacity:1;}
.bet-name{font-size:.68rem;letter-spacing:.12em;font-weight:bold;}
.bet-odds{font-size:.55rem;color:#444;letter-spacing:.07em;}
.bet-skip{
  font-size:.62rem;color:#2a2a44;letter-spacing:.14em;cursor:pointer;
  text-decoration:underline;margin-bottom:12px;transition:color .2s;
}
.bet-skip:hover{color:#666;}
.bet-start-btn{
  font-family:'Bebas Neue',cursive;font-size:1.55rem;letter-spacing:.25em;
  padding:11px 46px;background:linear-gradient(135deg,#ff3333,#aa0000);
  border:none;border-radius:8px;color:#fff;cursor:pointer;
  box-shadow:0 4px 20px #ff333333;transition:all .18s;
}
.bet-start-btn:hover{transform:scale(1.05);box-shadow:0 6px 28px #ff333355;}
.bet-start-btn:disabled{opacity:.35;cursor:default;transform:none;box-shadow:none;}

/* ── GAME SCREEN ── */
#game-screen{display:none;flex-direction:column;align-items:center;}
.game-header{display:flex;align-items:center;gap:20px;margin-bottom:9px;}
.game-title{font-family:'Bebas Neue',cursive;font-size:1.7rem;letter-spacing:.3em;color:#ff3333;text-shadow:0 0 14px #ff333344;}
#bet-indicator{font-size:.62rem;letter-spacing:.14em;color:#555;padding:3px 11px;border:1px solid #1e1e2e;border-radius:20px;}

#canvas-wrap{position:relative;}
canvas{display:block;}

#scoreboard{display:flex;justify-content:center;gap:12px;margin-top:11px;flex-wrap:wrap;}
.player-card{
  display:flex;flex-direction:column;align-items:center;gap:3px;
  background:#0d0d1a;border:1px solid #1a1a2e;border-radius:8px;
  padding:5px 9px;min-width:80px;
  transition:border-color .2s,box-shadow .2s;
  position:relative;
}
.player-card.is-pick{border-color:#ffcc00 !important;box-shadow:0 0 10px #ffcc0033;}
.player-card.hit{border-color:#ff4444;box-shadow:0 0 7px #ff444444;}
.player-card.dead{opacity:.22;}
.pick-star{position:absolute;top:-9px;left:50%;transform:translateX(-50%);font-size:11px;}
.player-name{font-size:.58rem;letter-spacing:.1em;text-transform:uppercase;}
.lives-row{display:flex;gap:2px;flex-wrap:wrap;max-width:72px;justify-content:center;}
.life-dot{width:6px;height:6px;border-radius:50%;transition:background .15s;}
.weapon-label{font-size:.5rem;color:#555;letter-spacing:.06em;min-height:8px;}

#status-bar{text-align:center;margin-top:7px;font-size:.62rem;color:#444;letter-spacing:.14em;height:13px;}

/* ── RESULT OVERLAY ── */
#result-overlay{
  display:none;position:absolute;top:0;left:0;right:0;bottom:0;
  border-radius:50%;
  background:radial-gradient(circle,#07070fee 60%,#07070f88);
  flex-direction:column;align-items:center;justify-content:center;
  z-index:10;animation:fadeIn .4s ease;
}
.result-title{font-family:'Bebas Neue',cursive;font-size:2.3rem;letter-spacing:.25em;}
.result-sub{font-size:.6rem;letter-spacing:.2em;color:#666;margin-top:1px;margin-bottom:3px;}
.result-verdict{font-size:.72rem;letter-spacing:.12em;padding:5px 16px;border-radius:18px;margin-top:5px;}
.result-verdict.win{color:#00ff88;border:1px solid #00ff8833;background:#00ff8811;}
.result-verdict.lose{color:#ff5555;border:1px solid #ff555533;background:#ff555511;}
.result-verdict.nobet{color:#666;border:1px solid #33333355;background:#11111188;}
.result-btns{display:flex;gap:11px;margin-top:13px;}
.result-btn{
  font-family:'Bebas Neue',cursive;font-size:1.05rem;letter-spacing:.14em;
  padding:7px 20px;border:none;border-radius:6px;cursor:pointer;transition:all .18s;
}
.result-btn.primary{background:#ff3333;color:#fff;}
.result-btn.secondary{background:#111122;color:#777;border:1px solid #2a2a44;}
.result-btn:hover{transform:scale(1.06);}
</style>
</head>
<body>

<!-- BETTING SCREEN -->
<div id="bet-screen">
  <div class="bet-title">ARENA</div>
  <div class="bet-sub">Circle of Survival</div>
  <div class="bet-prompt">🎰 Pick your champion</div>
  <div class="bet-grid" id="bet-grid"></div>
  <div class="bet-skip" onclick="startGame(null)">Skip — just watch</div>
  <button class="bet-start-btn" id="bet-start-btn" onclick="startGame(pickedId)" disabled>START FIGHT</button>
</div>

<!-- GAME SCREEN -->
<div id="game-screen">
  <div class="game-header">
    <div class="game-title">ARENA</div>
    <div id="bet-indicator">SPECTATING</div>
  </div>
  <div id="canvas-wrap">
    <canvas id="c"></canvas>
    <div id="result-overlay">
      <div class="result-title" id="result-title"></div>
      <div class="result-sub">LAST BALL STANDING</div>
      <div class="result-verdict" id="result-verdict"></div>
      <div class="result-btns">
        <button class="result-btn primary" onclick="goToBetting()">BET AGAIN</button>
        <button class="result-btn secondary" onclick="startGame(pickedId)">REMATCH</button>
      </div>
    </div>
  </div>
  <div id="scoreboard"></div>
  <div id="status-bar"></div>
</div>

<script>
const SIZE=560, CX=SIZE/2, CY=SIZE/2, R=SIZE/2-12;
const C=document.getElementById('c');
const ctx=C.getContext('2d');
C.width=SIZE; C.height=SIZE;

const BALL_CONFIGS=[
  {name:'NOVA',  color:'#ff4466',glow:'#ff446655'},
  {name:'CYAN',  color:'#00ddff',glow:'#00ddff44'},
  {name:'SOLAR', color:'#ffaa00',glow:'#ffaa0044'},
  {name:'VENOM', color:'#44ff88',glow:'#44ff8844'},
  {name:'PULSE', color:'#cc44ff',glow:'#cc44ff44'},
];

const WEAPONS=[
  {id:'pistol',  name:'PISTOL',  damage:2,bullets:1,spread:0,    speed:8,  color:'#e8c840',fireRate:1, icon:'🔫'},
  {id:'shotgun', name:'SHOTGUN', damage:3,bullets:5,spread:0.32, speed:6,  color:'#e07820',fireRate:1, icon:'💥'},
  {id:'sniper',  name:'SNIPER',  damage:5,bullets:1,spread:0,    speed:15, color:'#40aaff',fireRate:1, icon:'🎯'},
  {id:'minigun', name:'MINIGUN', damage:1,bullets:1,spread:0.18, speed:9,  color:'#ff6600',fireRate:6, icon:'🔥'},
  {id:'dagger',  name:'DAGGER',  damage:1,bullets:1,spread:0,    speed:17, color:'#aaaaff',fireRate:1, icon:'🗡️'},
  {id:'rocket',  name:'ROCKET',  damage:4,bullets:1,spread:0,    speed:4,  color:'#ff2222',fireRate:1, icon:'🚀',splash:true},
  {id:'laser',   name:'LASER',   damage:3,bullets:1,spread:0,    speed:19, color:'#00ff88',fireRate:1, icon:'⚡'},
  {id:'grenade', name:'GRENADE', damage:2,bullets:1,spread:0,    speed:4,  color:'#aaff00',fireRate:1, icon:'💣',grenade:true},
  {id:'smg',     name:'SMG',     damage:1,bullets:1,spread:0.1,  speed:10, color:'#ff88aa',fireRate:4, icon:'⚙️'},
  {id:'cannon',  name:'CANNON',  damage:6,bullets:1,spread:0,    speed:3,  color:'#ffcc44',fireRate:1, icon:'💫',splash:true},
];

let balls=[],items=[],bullets=[],particles=[],explosions=[];
let gameOver=false,frameCount=0,statusTimer=0,pickedId=null;

function rnd(a,b){return a+Math.random()*(b-a);}
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y);}
function angTo(a,b){return Math.atan2(b.y-a.y,b.x-a.x);}

/* ═══ BETTING SCREEN ═══ */
function buildBetScreen(){
  pickedId=null;
  const grid=document.getElementById('bet-grid');
  grid.innerHTML='';
  document.getElementById('bet-start-btn').disabled=true;
  BALL_CONFIGS.forEach((cfg,i)=>{
    const card=document.createElement('div');
    card.className='bet-card';
    const mc=document.createElement('canvas');
    mc.width=52;mc.height=52;
    drawMiniball(mc.getContext('2d'),26,26,20,cfg.color,cfg.glow);
    const nm=document.createElement('div');
    nm.className='bet-name';nm.style.color=cfg.color;nm.textContent=cfg.name;
    const odds=document.createElement('div');
    odds.className='bet-odds';odds.textContent='1 in 5 chance';
    const chk=document.createElement('div');
    chk.className='bet-check';chk.style.background=cfg.color;chk.style.color='#000';chk.textContent='✓';
    card.appendChild(chk);card.appendChild(mc);card.appendChild(nm);card.appendChild(odds);
    card.onclick=()=>{
      document.querySelectorAll('.bet-card').forEach(c=>{
        c.classList.remove('selected');
        c.style.borderColor='#1a1a2e';c.style.boxShadow='';
      });
      card.classList.add('selected');
      card.style.borderColor=cfg.color;
      card.style.boxShadow=`0 0 18px ${cfg.color}44,0 0 36px ${cfg.color}22`;
      pickedId=i;
      document.getElementById('bet-start-btn').disabled=false;
    };
    grid.appendChild(card);
  });
}

function drawMiniball(mctx,x,y,r,color,glow){
  const g=mctx.createRadialGradient(x,y,0,x,y,r*2);
  g.addColorStop(0,glow);g.addColorStop(1,'transparent');
  mctx.beginPath();mctx.arc(x,y,r*2,0,Math.PI*2);mctx.fillStyle=g;mctx.fill();
  const b=mctx.createRadialGradient(x-r*.3,y-r*.3,0,x,y,r);
  b.addColorStop(0,'#ffffffcc');b.addColorStop(.35,color);b.addColorStop(1,color+'88');
  mctx.beginPath();mctx.arc(x,y,r,0,Math.PI*2);mctx.fillStyle=b;mctx.fill();
  mctx.strokeStyle=color;mctx.lineWidth=1.5;mctx.stroke();
}

function goToBetting(){
  document.getElementById('game-screen').style.display='none';
  document.getElementById('bet-screen').style.display='flex';
  buildBetScreen();
}

/* ═══ INIT GAME ═══ */
function startGame(betOn){
  pickedId=(betOn===undefined)?null:betOn;
  document.getElementById('bet-screen').style.display='none';
  const gs=document.getElementById('game-screen');
  gs.style.display='flex';
  document.getElementById('result-overlay').style.display='none';

  const bi=document.getElementById('bet-indicator');
  if(pickedId!==null){
    const cfg=BALL_CONFIGS[pickedId];
    bi.innerHTML=`🎰 BACKING: <span style="color:${cfg.color};font-weight:bold">${cfg.name}</span>`;
    bi.style.borderColor=cfg.color+'44';
  } else {
    bi.textContent='SPECTATING';bi.style.borderColor='#1e1e2e';
  }

  balls=[];items=[];bullets=[];particles=[];explosions=[];
  gameOver=false;frameCount=0;

  BALL_CONFIGS.forEach((cfg,i)=>{
    const a=(i/BALL_CONFIGS.length)*Math.PI*2;
    const sa=rnd(0,Math.PI*2);
    balls.push({
      id:i,name:cfg.name,color:cfg.color,glow:cfg.glow,
      x:CX+Math.cos(a)*(R*.42),
      y:CY+Math.sin(a)*(R*.42),
      vx:Math.cos(sa)*rnd(3,5),
      vy:Math.sin(sa)*rnd(3,5),
      r:14,lives:10,maxLives:10,
      weapon:null,hitFlash:0,dead:false,
      fireTimer:Math.floor(rnd(0,40)),
      wAng:rnd(0,Math.PI*2),   // current wander heading
      wTimer:Math.floor(rnd(0,70)), // frames until next heading change
      target:null,
    });
  });
  updateScoreboard();
  spawnItem();
}

/* ═══ SPAWN WEAPON ═══ */
function spawnItem(){
  if(gameOver)return;
  const a=rnd(0,Math.PI*2),rad=rnd(R*.1,R*.76);
  const w=WEAPONS[Math.floor(Math.random()*WEAPONS.length)];
  items.push({x:CX+Math.cos(a)*rad,y:CY+Math.sin(a)*rad,weapon:w,pulse:0});
}

/* ═══ FIRE ═══ */
function fireBullet(ball){
  if(!ball.weapon||ball.dead)return;
  const w=ball.weapon;
  const tgt=ball.target||findTarget(ball);
  if(!tgt)return;
  const baseA=angTo(ball,tgt);
  const shots=w.id==='shotgun'?w.bullets:1;
  for(let i=0;i<shots;i++){
    const sp=shots>1?(i/(shots-1)-.5)*w.spread*2:(Math.random()-.5)*w.spread;
    const a=baseA+sp;
    bullets.push({
      x:ball.x,y:ball.y,
      vx:Math.cos(a)*w.speed,vy:Math.sin(a)*w.speed,
      owner:ball.id,damage:w.damage,color:w.color,weapon:w,
      r:w.splash?6:3,age:0,
      bounces:w.grenade?3:0,
    });
  }
  for(let j=0;j<6;j++){
    const a=baseA+rnd(-.4,.4);
    particles.push({x:ball.x,y:ball.y,vx:Math.cos(a)*rnd(2,7),vy:Math.sin(a)*rnd(2,7),
      life:1,decay:rnd(.1,.18),r:rnd(1,3),color:w.color});
  }
  ball.weapon=null;
  updateScoreboard();
}

function findTarget(ball){
  let best=null,bd=9999;
  balls.forEach(b=>{if(b.id!==ball.id&&!b.dead){const d=dist(ball,b);if(d<bd){bd=d;best=b;}}});
  return best;
}

/* ═══ UPDATE ═══ */
function update(){
  if(gameOver)return;
  frameCount++;
  if(items.length===0||(frameCount%180===0&&items.length<3))spawnItem();

  /* ── Balls ── */
  balls.forEach(ball=>{
    if(ball.dead)return;
    const MAX=4.2;

    // Wander: every wTimer frames, nudge heading by a random angle delta
    ball.wTimer--;
    if(ball.wTimer<=0){
      ball.wTimer=Math.floor(rnd(40,95));
      ball.wAng+=rnd(-Math.PI*.8,Math.PI*.8);
    }
    // Drive force along current heading
    ball.vx+=Math.cos(ball.wAng)*.15;
    ball.vy+=Math.sin(ball.wAng)*.15;

    // Soft center pull — only kicks in past 60% radius so middle stays open
    const toCX=CX-ball.x,toCY=CY-ball.y;
    const toDist=Math.hypot(toCX,toCY);
    if(toDist>R*.58){
      ball.vx+=(toCX/toDist)*.10;
      ball.vy+=(toCY/toDist)*.10;
    }

    // Ball-to-ball elastic collision
    balls.forEach(other=>{
      if(other.id<=ball.id||other.dead)return;
      const dx=ball.x-other.x,dy=ball.y-other.y;
      const d=Math.hypot(dx,dy);
      const minD=ball.r+other.r;
      if(d<minD&&d>.01){
        const ov=(minD-d)/2+.5,nx=dx/d,ny=dy/d;
        ball.x+=nx*ov;ball.y+=ny*ov;
        other.x-=nx*ov;other.y-=ny*ov;
        const dvx=ball.vx-other.vx,dvy=ball.vy-other.vy;
        const dot=dvx*nx+dvy*ny;
        if(dot<0){
          const imp=dot*.78;
          ball.vx-=imp*nx;ball.vy-=imp*ny;
          other.vx+=imp*nx;other.vy+=imp*ny;
        }
      }
    });

    // Speed cap
    const spd=Math.hypot(ball.vx,ball.vy);
    if(spd>MAX){ball.vx=ball.vx/spd*MAX;ball.vy=ball.vy/spd*MAX;}

    ball.x+=ball.vx;ball.y+=ball.vy;

    // Wall bounce with energy loss — feels solid
    const dr=Math.hypot(ball.x-CX,ball.y-CY);
    if(dr>R-ball.r){
      const nx=(ball.x-CX)/dr,ny=(ball.y-CY)/dr;
      const dot=ball.vx*nx+ball.vy*ny;
      if(dot>0){
        ball.vx=(ball.vx-2*dot*nx)*.60;
        ball.vy=(ball.vy-2*dot*ny)*.60;
        // redirect wander heading back inward
        ball.wAng=Math.atan2(-ny,-nx)+rnd(-.5,.5);
        ball.wTimer=0;
      }
      ball.x=CX+nx*(R-ball.r-1);
      ball.y=CY+ny*(R-ball.r-1);
    }

    // Friction — grounded, not floaty
    ball.vx*=.950;
    ball.vy*=.950;

    // Passive pickup — ball rolls over weapon
    for(let idx=items.length-1;idx>=0;idx--){
      const item=items[idx];
      if(!ball.weapon&&dist(ball,item)<ball.r+13){
        ball.weapon=item.weapon;
        items.splice(idx,1);
        for(let j=0;j<14;j++){
          const a=rnd(0,Math.PI*2);
          particles.push({x:item.x,y:item.y,vx:Math.cos(a)*rnd(1,5),vy:Math.sin(a)*rnd(1,5),
            life:1,decay:.06,r:rnd(2,4),color:ball.weapon.color});
        }
        setStatus(`${ball.name} grabbed ${ball.weapon.name}!`);
        updateScoreboard();
        break;
      }
    }

    // Fire while moving — no stopping
    if(ball.weapon){
      ball.fireTimer--;
      if(ball.fireTimer<=0){
        const tgt=findTarget(ball);
        if(tgt){
          const d=dist(ball,tgt);
          let range=270;
          if(ball.weapon.id==='sniper')range=900;
          if(ball.weapon.id==='laser')range=550;
          if(ball.weapon.id==='dagger')range=400;
          if(d<range){
            ball.target=tgt;
            fireBullet(ball);
            const fr=ball.weapon?.fireRate||1;
            ball.fireTimer=Math.max(5,Math.round(55/fr));
          } else {ball.fireTimer=18;}
        } else {ball.fireTimer=18;}
      }
    }

    if(ball.hitFlash>0)ball.hitFlash-=.032;
  });

  /* ── Bullets ── */
  for(let i=bullets.length-1;i>=0;i--){
    const b=bullets[i];
    b.x+=b.vx;b.y+=b.vy;b.age++;
    if(b.age%2===0)
      particles.push({x:b.x,y:b.y,vx:rnd(-.4,.4),vy:rnd(-.4,.4),
        life:.6,decay:.09,r:b.r*.5,color:b.color});
    const bdr=Math.hypot(b.x-CX,b.y-CY);
    if(b.bounces>0&&bdr>R-b.r){
      const nx=(b.x-CX)/bdr,ny=(b.y-CY)/bdr;
      const dot=b.vx*nx+b.vy*ny;
      b.vx-=2*dot*nx;b.vy-=2*dot*ny;
      b.bounces--;b.x=CX+nx*(R-b.r-1);b.y=CY+ny*(R-b.r-1);
    } else if(bdr>R-3){
      if(b.weapon.splash||b.weapon.grenade)spawnExplosion(b.x,b.y,b.damage,b.owner,b.color);
      bullets.splice(i,1);continue;
    }
    if(b.age>220){bullets.splice(i,1);continue;}
    let hit=false;
    balls.forEach(ball=>{
      if(ball.dead||ball.id===b.owner||hit)return;
      if(dist(b,ball)<ball.r+b.r){
        hit=true;
        if(b.weapon.splash||b.weapon.grenade)spawnExplosion(b.x,b.y,b.damage,b.owner,b.color);
        else applyDamage(ball,b.damage,b.color);
        for(let j=0;j<10;j++){
          const a=rnd(0,Math.PI*2);
          particles.push({x:b.x,y:b.y,vx:Math.cos(a)*rnd(2,6),vy:Math.sin(a)*rnd(2,6),
            life:1,decay:.08,r:rnd(1,3),color:b.color});
        }
      }
    });
    if(hit)bullets.splice(i,1);
  }

  /* ── Explosions ── */
  for(let i=explosions.length-1;i>=0;i--){
    const e=explosions[i];
    e.r+=3.5;e.life-=.055;
    if(e.life<=0){explosions.splice(i,1);continue;}
    balls.forEach(ball=>{
      if(ball.dead||ball.id===e.owner||e.damaged.has(ball.id))return;
      if(dist(ball,e)<e.r+ball.r){e.damaged.add(ball.id);applyDamage(ball,e.damage,e.color);}
    });
  }

  /* ── Particles ── */
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];
    p.x+=p.vx;p.y+=p.vy;p.life-=p.decay;p.vx*=.90;p.vy*=.90;
    if(p.life<=0)particles.splice(i,1);
  }

  items.forEach(it=>it.pulse+=.07);
  if(statusTimer>0){statusTimer--;if(!statusTimer)document.getElementById('status-bar').textContent='';}

  const alive=balls.filter(b=>!b.dead);
  if(alive.length<=1&&!gameOver){
    gameOver=true;
    showResult(alive[0]||null);
  }
}

function applyDamage(ball,dmg,color){
  ball.lives=Math.max(0,ball.lives-dmg);
  ball.hitFlash=1;
  updateScoreboard();
  setStatus(`${ball.name} hit! -${dmg} HP`);
  for(let j=0;j<8;j++){
    const a=rnd(0,Math.PI*2);
    particles.push({x:ball.x,y:ball.y,vx:Math.cos(a)*rnd(1,4),vy:Math.sin(a)*rnd(1,4),
      life:1,decay:.07,r:rnd(2,4),color:'#ff3333'});
  }
  if(ball.lives===0){
    ball.dead=true;ball.weapon=null;
    for(let j=0;j<32;j++){
      const a=rnd(0,Math.PI*2);
      particles.push({x:ball.x,y:ball.y,vx:Math.cos(a)*rnd(2,9),vy:Math.sin(a)*rnd(2,9),
        life:1,decay:.024,r:rnd(3,7),color:ball.color});
    }
    setStatus(`☠ ${ball.name} ELIMINATED!`);
    updateScoreboard();
  }
}

function spawnExplosion(x,y,dmg,owner,color){
  explosions.push({x,y,r:8,damage:dmg,owner,color,life:1,damaged:new Set()});
  for(let j=0;j<28;j++){
    const a=rnd(0,Math.PI*2);
    particles.push({x,y,vx:Math.cos(a)*rnd(3,11),vy:Math.sin(a)*rnd(3,11),
      life:1,decay:rnd(.03,.06),r:rnd(3,8),color});
  }
}

function setStatus(msg){document.getElementById('status-bar').textContent=msg;statusTimer=140;}

/* ═══ RESULT ═══ */
function showResult(winner){
  const overlay=document.getElementById('result-overlay');
  const title=document.getElementById('result-title');
  const verdict=document.getElementById('result-verdict');
  overlay.style.display='flex';
  if(winner){
    title.textContent=`${winner.name} WINS!`;
    title.style.color=winner.color;
    title.style.textShadow=`0 0 28px ${winner.color}88`;
    if(pickedId===null||pickedId===undefined){
      verdict.textContent='You were spectating.';
      verdict.className='result-verdict nobet';
    } else if(winner.id===pickedId){
      verdict.textContent='🏆 YOUR PICK WON — NICE CALL!';
      verdict.className='result-verdict win';
    } else {
      verdict.textContent=`💀 YOUR PICK (${BALL_CONFIGS[pickedId].name}) LOST`;
      verdict.className='result-verdict lose';
    }
    for(let j=0;j<90;j++){
      const a=rnd(0,Math.PI*2);
      particles.push({x:winner.x,y:winner.y,
        vx:Math.cos(a)*rnd(2,12),vy:Math.sin(a)*rnd(2,12),
        life:1,decay:rnd(.007,.02),r:rnd(2,6),color:winner.color});
    }
  } else {
    title.textContent='DRAW!';title.style.color='#888';title.style.textShadow='';
    verdict.textContent='Everyone was eliminated.';
    verdict.className='result-verdict nobet';
  }
}

/* ═══ DRAW ═══ */
function draw(){
  ctx.clearRect(0,0,SIZE,SIZE);
  const bg=ctx.createRadialGradient(CX,CY,0,CX,CY,R);
  bg.addColorStop(0,'#0f0f1e');bg.addColorStop(1,'#07070f');
  ctx.beginPath();ctx.arc(CX,CY,R,0,Math.PI*2);ctx.fillStyle=bg;ctx.fill();

  ctx.beginPath();ctx.arc(CX,CY,R,0,Math.PI*2);
  ctx.strokeStyle='#ff222288';ctx.lineWidth=3;ctx.stroke();
  ctx.strokeStyle='#ff222222';ctx.lineWidth=10;ctx.stroke();

  ctx.save();
  ctx.beginPath();ctx.arc(CX,CY,R-2,0,Math.PI*2);ctx.clip();

  ctx.strokeStyle='#ffffff06';ctx.lineWidth=1;
  for(let x=0;x<=SIZE;x+=44){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,SIZE);ctx.stroke();}
  for(let y=0;y<=SIZE;y+=44){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(SIZE,y);ctx.stroke();}

  explosions.forEach(e=>{
    const eg=ctx.createRadialGradient(e.x,e.y,0,e.x,e.y,e.r);
    eg.addColorStop(0,e.color+'ff');eg.addColorStop(.5,e.color+'66');eg.addColorStop(1,e.color+'00');
    ctx.beginPath();ctx.arc(e.x,e.y,e.r,0,Math.PI*2);
    ctx.fillStyle=eg;ctx.globalAlpha=e.life;ctx.fill();ctx.globalAlpha=1;
  });

  particles.forEach(p=>{
    ctx.beginPath();ctx.arc(p.x,p.y,Math.max(.3,p.r*p.life),0,Math.PI*2);
    ctx.fillStyle=p.color;ctx.globalAlpha=p.life*.8;ctx.fill();
  });
  ctx.globalAlpha=1;

  items.forEach(item=>{
    const pulse=Math.sin(item.pulse)*.22+.78;
    const gr=ctx.createRadialGradient(item.x,item.y,0,item.x,item.y,22);
    gr.addColorStop(0,item.weapon.color+'44');gr.addColorStop(1,item.weapon.color+'00');
    ctx.beginPath();ctx.arc(item.x,item.y,22,0,Math.PI*2);ctx.fillStyle=gr;ctx.fill();
    ctx.font=`${14*pulse}px serif`;ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(item.weapon.icon,item.x,item.y);
    ctx.font='bold 7px Share Tech Mono';
    ctx.fillStyle=item.weapon.color;ctx.globalAlpha=.75;
    ctx.fillText(item.weapon.name,item.x,item.y+15);ctx.globalAlpha=1;
  });

  bullets.forEach(b=>{
    ctx.save();
    if(b.weapon.id==='laser'){
      ctx.beginPath();ctx.moveTo(b.x,b.y);ctx.lineTo(b.x-b.vx*9,b.y-b.vy*9);
      ctx.strokeStyle=b.color;ctx.lineWidth=4;ctx.shadowBlur=14;ctx.shadowColor=b.color;ctx.stroke();
    } else if(b.weapon.splash){
      ctx.font='12px serif';ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillText(b.weapon.icon,b.x,b.y);
    } else {
      ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,Math.PI*2);
      ctx.fillStyle=b.color;ctx.shadowBlur=10;ctx.shadowColor=b.color;ctx.fill();
    }
    ctx.restore();
  });

  balls.forEach(ball=>{
    if(ball.dead){
      ctx.globalAlpha=.08;
      ctx.beginPath();ctx.arc(ball.x,ball.y,ball.r,0,Math.PI*2);
      ctx.fillStyle=ball.color;ctx.fill();ctx.globalAlpha=1;return;
    }
    ctx.save();
    // glow
    const og=ctx.createRadialGradient(ball.x,ball.y,0,ball.x,ball.y,ball.r*2.3);
    og.addColorStop(0,ball.glow);og.addColorStop(1,'transparent');
    ctx.beginPath();ctx.arc(ball.x,ball.y,ball.r*2.3,0,Math.PI*2);ctx.fillStyle=og;ctx.fill();
    // body
    const mg=ctx.createRadialGradient(ball.x-4,ball.y-4,0,ball.x,ball.y,ball.r);
    mg.addColorStop(0,'#ffffffbb');mg.addColorStop(.3,ball.color);mg.addColorStop(1,ball.color+'77');
    ctx.beginPath();ctx.arc(ball.x,ball.y,ball.r,0,Math.PI*2);ctx.fillStyle=mg;ctx.fill();
    ctx.strokeStyle=ball.color;ctx.lineWidth=1.5;ctx.stroke();
    // hit flash
    if(ball.hitFlash>0){
      ctx.beginPath();ctx.arc(ball.x,ball.y,ball.r,0,Math.PI*2);
      ctx.fillStyle=`rgba(255,50,50,${ball.hitFlash*.72})`;ctx.fill();
    }
    // picked ring — animated dashed
    if(pickedId===ball.id){
      ctx.beginPath();ctx.arc(ball.x,ball.y,ball.r+5,0,Math.PI*2);
      ctx.strokeStyle='#ffcc00';ctx.lineWidth=2;
      ctx.setLineDash([4,4]);
      ctx.globalAlpha=.65+Math.sin(frameCount*.14)*.3;
      ctx.stroke();ctx.setLineDash([]);ctx.globalAlpha=1;
    }
    if(ball.weapon){
      ctx.font='11px serif';ctx.textAlign='center';ctx.textBaseline='bottom';
      ctx.fillText(ball.weapon.icon,ball.x,ball.y-ball.r-1);
    }
    ctx.font='bold 7px Share Tech Mono';
    ctx.textAlign='center';ctx.textBaseline='top';
    ctx.fillStyle='#ffffffaa';
    ctx.fillText(ball.name,ball.x,ball.y+ball.r+2);
    ctx.restore();
  });

  ctx.restore();
}

/* ═══ SCOREBOARD ═══ */
function updateScoreboard(){
  const sb=document.getElementById('scoreboard');
  sb.innerHTML='';
  balls.forEach(ball=>{
    const card=document.createElement('div');
    let cls='player-card';
    if(ball.dead)cls+=' dead';
    else if(ball.hitFlash>.5)cls+=' hit';
    if(pickedId===ball.id)cls+=' is-pick';
    card.className=cls;card.style.color=ball.color;
    if(pickedId===ball.id){
      const star=document.createElement('div');
      star.className='pick-star';star.textContent='⭐';
      card.appendChild(star);
    }
    const nm=document.createElement('div');nm.className='player-name';nm.textContent=ball.name;
    const lr=document.createElement('div');lr.className='lives-row';
    for(let i=0;i<ball.maxLives;i++){
      const d=document.createElement('div');d.className='life-dot';
      d.style.background=i<ball.lives?ball.color:'#1a1a2e';
      if(i<ball.lives)d.style.boxShadow=`0 0 3px ${ball.color}`;
      lr.appendChild(d);
    }
    const wp=document.createElement('div');wp.className='weapon-label';
    wp.textContent=ball.weapon?`${ball.weapon.icon} ${ball.weapon.name}`:'';
    card.appendChild(nm);card.appendChild(lr);card.appendChild(wp);
    sb.appendChild(card);
  });
}

/* ═══ LOOP ═══ */
function loop(){update();draw();requestAnimationFrame(loop);}

buildBetScreen();
loop();
</script>
